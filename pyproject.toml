[project]
name = "pc-agent-assistant"
version = "0.1.0"
description = "Локальный AI-ассистент для общения и действий на ПК"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cursor Agent" }
]

[project.optional-dependencies]
voice = [
  "SpeechRecognition",
  "PyAudio",
  "pyttsx3",
]
screen = [
  "mss",
  "Pillow",
  "pytesseract",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant"]
